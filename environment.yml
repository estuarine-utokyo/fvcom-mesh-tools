name: fvcom-mesh-tools
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Scientific stack
  - numpy
  - scipy
  - matplotlib
  - shapely
  - geopandas
  - rasterio
  - rioxarray
  - netcdf4
  - libgdal-netcdf  # GDAL netCDF driver - lets rasterio.open() handle .nc DEMs
  - scikit-image
  - scikit-fmm
  - meshio
  - numba       # oceanmesh JIT kernels
  - xarray
  - h5py
  - pyyaml      # recipe files
  - xlrd        # .xls area tables of the Cabinet Office topography
  - pyarrow     # M7001 soundings (parquet)
  - utide       # tidal harmonic analysis and prediction (MIT)
  - plotly
  - pyogrio     # xcoast
  - fiona
  - pyproj
  # Not in the default environment (owner, 2026-10-02): OCSMesh imports
  # Triangle at package load, and jigsawpy loads the JIGSAW core; both forbid
  # commercial redistribution and are not GPL-compatible. They serve only the
  # optional paths (--engine ocsmesh, fmesh-mesh-combine, --repair-skewed-
  # elements). For private use, install them yourself:
  #   mamba install -c conda-forge ocsmesh jigsawpy triangle
  # and never redistribute them together with this package.
  # C++ build chain for building oceanmesh from source
  # (CGAL headers + its gmp/mpfr arithmetic backends)
  - cgal
  - gmp
  - mpfr
  - cython
  - pybind11
  - setuptools
  - wheel
  - cxx-compiler  # conda-forge toolchain; rpath-links the env's gmp/mpfr
  # Dev tooling
  - pytest
  - ruff
  - pre-commit
  - pip
  # oceanmesh is GPL-3.0-or-later and NOT on conda-forge/PyPI —
  # install our fork (constrained Delaunay / pfix / egfix) from a
  # local clone after env creation:
  #   git clone https://github.com/estuarine-utokyo/oceanmesh.git ~/Github/oceanmesh
  #   cd ~/Github/oceanmesh   (the refinement generator looks there first)
  #   pip install -e . --no-deps --no-build-isolation      # GNU toolchain
  #   CC=icx CXX=icpx pip install -e . --no-deps --no-build-isolation
  # (-static-intel is applied automatically; see oceanmesh README 3.4)
  # Then this repo, and xcoast
  # (https://github.com/estuarine-utokyo/xcoast) the same way:
  #   pip install --no-deps --no-build-isolation -e .
  # --no-build-isolation keeps pip from fetching build deps from PyPI;
  # every dependency comes from conda-forge.
