# FUNABASHI PORT: the third port example (after Kimitsu and Odaiba).
#
# Surveyed before this was written (notebooks/423_site_survey.py, job 116463,
# two 1.2 km discs):
#
#   * A, 139.985 35.685: 21 % water, 4 land rings, 7.1 km of shoreline.
#   * B, 139.975 35.680: 35 % water, 3 land rings, 10.4 km of shoreline --
#     the port basin, the quays of the reclaimed land and the mouth of the
#     river channel on the west side.
#
# This recipe is B moved 330 m north-east and widened to 1.4 km: at 1.2 km
# the dock basin in the north-east corner of the port sat on the edge of the
# circle, among 30-96 m elements, and a wall root there failed QA in every
# one of ten seeds.
#   * the base mesh has 6 coastline edges in B, and 13 elements with a
#     median edge of 615 m: it represents none of the basin.
#   * depths -3.7 to 14.3 m; 7 % of the disc at or above datum.
#
# The outline is a DEMONSTRATION circle over the port, not a port limit.
base_mesh: ~/Github/TB-FVCOM/input/goto2023/grid/TokyoBay_grd.dat
base_depth: ~/Github/TB-FVCOM/input/goto2023/grid/TokyoBay_dep_m7001tp_rfac0p2_cap300.dat
base_obc: ~/Github/TB-FVCOM/input/goto2023/grid/TokyoBay_obc.dat

dt_expected_s: 4.5
gradation: 0.165

hires:
  coastline: resolve
  bathymetry: tokyo_bay
  scope: hole
  blend: ramp
  # The coastline rules (docs/USER_GUIDE.md, all on by default) carry this
  # port: two river mouths 1-2 km west of the circle meet the coarse
  # transition (h 120-240 m), where continuous_width judges the water at the
  # local element size, and a curled breakwater shuts in a 400 x 230 m
  # pocket that wall_pockets closes. Until 2026-09-27 the recipe named
  # water_wedges, wall_pockets and short_chords.
  # Accepted 2026-09-27: seed 3, 0 introduced violations, NP 6,675, dt 1.45 s.

refine:
  - name: funabashi_port
    geometry:
      circle: {center: [139.9780, 35.6820], radius_m: 1400}
    target_h_m: 30
    priority: 0
